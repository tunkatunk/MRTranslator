[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrtranslator"
version = "0.1.0"
description = "OCR processing utilities for MRTranslator"
authors = [
  { name = "OpenAI Assistant" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pillow>=10.0.0",
  "numpy>=1.23",
  "pytesseract>=0.3.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
